<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate</title>
  <link rel="icon" href="../imgs/logomain.png">
  <link rel="stylesheet" href="./global.css?v01">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.9.1/font/bootstrap-icons.min.css">

  <style>
    :root {
      --certificate-primary: #155eef;
      --certificate-text: #17233d;
      --certificate-muted: #667085;
      --certificate-border: #e5eaf2;
    }

    .certificate-page {
      min-height: 100%;
      padding: 8px 2px 40px;
      color: var(--certificate-text);
    }

    .certificate-hero {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border-radius: 22px;
      color: #fff;
      background: linear-gradient(125deg, #0f4ed8, #1685ff);
      box-shadow: 0 16px 40px rgba(21, 94, 239, .2);
    }

    .certificate-hero::after {
      content: "";
      position: absolute;
      right: -60px;
      bottom: -100px;
      width: 260px;
      height: 260px;
      border: 42px solid rgba(255, 255, 255, .1);
      border-radius: 50%;
    }

    .certificate-hero h1 {
      margin-bottom: 8px;
      font-size: clamp(1.65rem, 3vw, 2.35rem);
      font-weight: 700;
    }

    .certificate-hero p {
      max-width: 700px;
      margin: 0;
      color: rgba(255, 255, 255, .82);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 20px 0;
    }

    .summary-card,
    .certificate-card {
      border: 1px solid var(--certificate-border);
      background: #fff;
      box-shadow: 0 8px 28px rgba(16, 24, 40, .06);
    }

    .summary-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      border-radius: 18px;
    }

    .summary-icon,
    .certificate-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      font-size: 1.35rem;
    }

    .summary-icon.blue { color: #155eef; background: #eaf2ff; }
    .summary-icon.green { color: #079455; background: #e9fbf2; }
    .summary-icon.purple { color: #6938ef; background: #f1edff; }

    .summary-label {
      margin-bottom: 2px;
      color: var(--certificate-muted);
      font-size: .86rem;
    }

    .summary-value {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .certificate-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .certificate-card {
      padding: 22px;
      border-radius: 20px;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .certificate-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(16, 24, 40, .1);
    }

    .certificate-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .certificate-domain-wrap {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .certificate-icon {
      color: #155eef;
      background: #eaf2ff;
    }


    .certificate-domain {
      overflow-wrap: anywhere;
      margin: 0 0 3px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .certificate-provider {
      margin: 0;
      color: var(--certificate-muted);
      font-size: .82rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 600;
    }

    .status-ok { color: #067647; background: #ecfdf3; }
    .status-warning { color: #b54708; background: #fffaeb; }
    .status-danger { color: #b42318; background: #fef3f2; }

    .days-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin: 24px 0 10px;
    }

    .days-number {
      font-size: 2.25rem;
      font-weight: 750;
      line-height: 1;
    }

    .days-unit,
    .days-caption {
      color: var(--certificate-muted);
      font-size: .85rem;
    }

    .certificate-progress {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #eef2f6;
    }

    .certificate-progress-bar {
      height: 100%;
      border-radius: inherit;
      transition: width .4s ease;
    }

    .progress-ok { background: linear-gradient(90deg, #12b76a, #32d583); }
    .progress-warning { background: linear-gradient(90deg, #f79009, #fdb022); }
    .progress-danger { background: linear-gradient(90deg, #d92d20, #f04438); }

    .certificate-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #eef2f6;
    }

    .detail-label {
      display: block;
      margin-bottom: 4px;
      color: var(--certificate-muted);
      font-size: .77rem;
    }

    .detail-value {
      margin: 0;
      font-size: .88rem;
      font-weight: 600;
    }




    .last-update {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 18px;
      font-size: .82rem;
      color: rgba(255, 255, 255, .8);
    }

    @media (max-width: 900px) {
      .summary-grid,
      .certificate-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 576px) {
      .certificate-hero { padding: 22px 18px; }
      .certificate-card { padding: 18px; }
      .certificate-card-head { align-items: flex-start; }
      .status-badge span { display: none; }
      .certificate-details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div onclick="keepSidebar()" class="overlaysidebar" style="display:none;width:100%;height:100vh;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.5)"></div>
    <div class="fakesidebar"></div>
    <div class="sidebar">
      <div onclick="keepSidebar()" class="keepsidebar" style="position:absolute;z-index:100;right:40px">
        <i class="bi bi-box-arrow-in-left text-white"></i>
      </div>
      <div id="sidebartitle" class="d-flex align-items-center"></div>
      <div id="sidebar" class="sidebar-main" style="overflow:scroll;height:calc(100vh - 170px)"></div>
    </div>

    <main class="content">
      <div class="content-navbar">
        <div class="content-search">
          <div class="d-flex align-items-center">
            <div onclick="toggleSidebar()" class="hamburger me-3"><i class="bi bi-list"></i></div>
          </div>
        </div>
        <div id="boxProfile" class="content-profile"></div>
      </div>

      <div class="content-page certificate-page">
        <section class="certificate-hero">
          <div style="position:relative;z-index:1">
            <h1><i class="bi bi-shield-check me-2"></i>Certificate Monitor</h1>
            <p>ติดตามวันหมดอายุใบรับรอง SSL ของระบบ เพื่อให้ต่ออายุได้ทันก่อนผู้ใช้งานพบปัญหา</p>
            <div class="last-update"><i class="bi bi-clock"></i><span id="lastUpdate"></span></div>
          </div>
        </section>

        <section class="summary-grid" aria-label="สรุปใบรับรอง">
          <article class="summary-card">
            <div class="summary-icon blue"><i class="bi bi-shield-check"></i></div>
            <div><div class="summary-label">Certificate ที่ติดตาม</div><p class="summary-value" id="totalCount">-</p></div>
          </article>
          <article class="summary-card">
            <div class="summary-icon green"><i class="bi bi-hourglass-split"></i></div>
            <div><div class="summary-label">ใกล้หมดอายุที่สุด</div><p class="summary-value" id="nearestDays">-</p></div>
          </article>
          <article class="summary-card">
            <div class="summary-icon purple"><i class="bi bi-calendar-event"></i></div>
            <div><div class="summary-label">หมดอายุรอบถัดไป</div><p class="summary-value" id="nextExpiry">-</p></div>
          </article>
        </section>

        <section id="certificateList" class="certificate-list" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <script src="./global.js?v05"></script>
  <script>
    const renewedAt = '2026-10-23T00:00:00+07:00';
    const expiresAt = '2027-01-23T00:00:00+07:00';
    const certificates = [
      { domain: 'modify-api.utwgpa.com', provider: 'ผ่าน Cloudflare · ต่ออายุทุก 3 เดือน', renewedAt, expiresAt },
      { domain: 'prd-api.utwgpa.com', provider: 'ผ่าน Cloudflare · ต่ออายุทุก 3 เดือน', renewedAt, expiresAt },
      { domain: 'repeat-api.utwgpa.com', provider: 'ผ่าน Cloudflare · ต่ออายุทุก 3 เดือน', renewedAt, expiresAt },
      { domain: 'utw.ac.th', provider: 'UTW Certificate · ต่ออายุทุก 3 เดือน', renewedAt, expiresAt }
    ];

    const dayMs = 24 * 60 * 60 * 1000;

    function thaiDate(date) {
      return date.toLocaleString('th-TH', {
        timeZone: 'Asia/Bangkok',
        dateStyle: 'long',
        timeStyle: 'short'
      }) + ' น.';
    }

    function certificateStatus(days) {
      if (days <= 0) return { label: 'หมดอายุแล้ว', tone: 'danger' };
      if (days <= 7) return { label: 'ต้องต่ออายุด่วน', tone: 'danger' };
      if (days <= 30) return { label: 'ใกล้หมดอายุ', tone: 'warning' };
      return { label: 'ใช้งานปกติ', tone: 'ok' };
    }

    function renderCertificates() {
      const now = new Date();
      const items = certificates.map(item => {
        const renewedAt = new Date(item.renewedAt);
        const expiresAt = new Date(item.expiresAt);
        return {
          ...item,
          renewedAt,
          expiresAt,
          validityDays: Math.round((expiresAt - renewedAt) / dayMs),
          days: Math.max(0, Math.ceil((expiresAt - now) / dayMs))
        };
      });

      document.getElementById('totalCount').textContent = items.length + ' รายการ';
      document.getElementById('nextExpiry').textContent = thaiDate(new Date(Math.min(...items.map(item => item.expiresAt)))).replace(/ เวลา.*/, '');
      document.getElementById('nearestDays').textContent = Math.min(...items.map(item => item.days)) + ' วัน';
      document.getElementById('lastUpdate').textContent = 'อัปเดตล่าสุด ' + thaiDate(now);

      document.getElementById('certificateList').innerHTML = items.map(data => {
        const status = certificateStatus(data.days);
        const progress = Math.max(0, Math.min(100, (data.days / data.validityDays) * 100));
        const renewBefore = new Date(data.expiresAt.getTime() - (30 * dayMs));

        return `
          <article class="certificate-card">
            <div class="certificate-card-head">
              <div class="certificate-domain-wrap">
                <div class="certificate-icon"><i class="bi bi-shield-lock-fill"></i></div>
                <div><h2 class="certificate-domain">${data.domain}</h2><p class="certificate-provider">${data.provider}</p></div>
              </div>
              <div class="status-badge status-${status.tone}"><i class="bi bi-circle-fill" style="font-size:.45rem"></i><span>${status.label}</span></div>
            </div>
            <div class="days-row">
              <div><span class="days-number">${data.days}</span> <span class="days-unit">วัน</span></div>
              <span class="days-caption">คงเหลือจาก ${data.validityDays} วัน</span>
            </div>
            <div class="certificate-progress" role="progressbar" aria-label="เหลือ ${data.days} วัน" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100">
              <div class="certificate-progress-bar progress-${status.tone}" style="width:${progress}%"></div>
            </div>
            <div class="certificate-details">
              <div><span class="detail-label">ต่ออายุล่าสุด</span><p class="detail-value">${thaiDate(data.renewedAt)}</p></div>
              <div><span class="detail-label">วันหมดอายุ</span><p class="detail-value">${thaiDate(data.expiresAt)}</p></div>
              <div><span class="detail-label">แนะนำให้ต่อภายใน</span><p class="detail-value">${thaiDate(renewBefore)}</p></div>
              <div><span class="detail-label">อายุใบรับรอง</span><p class="detail-value">${data.validityDays} วัน</p></div>
            </div>
          </article>`;
      }).join('');
    }

    renderCertificates();
  </script>
</body>
</html>
